name: Build & Deploy

on:
  push:
    branches: [ "production" ]

jobs:
  build-and-deploy:
    runs-on: "ubuntu-24.04-arm"

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: "npm"
          architecture: "arm64"
      - run: npm ci --force
      - run: npm run build --if-present

      - uses: a7ul/tar-action@v1.1.3
        with:
          command: c
          cwd: "./"
          files: |
            ./
          outPath: deploy.tar

      - name: Deploy App to CapRover
        uses: actions/setup-node@v3
        with:
          node-version: "20.x"
          cache: "npm"
          architecture: "arm64"
      - run: npm install -g caprover
      - run: npm cache clean --force
      - run: caprover deploy --caproverUrl '${{ secrets.CAPROVER_URL_PROD }}' --appToken '${{ secrets.CAPROVER_TOKEN_PROD }}' --appName 'clickup-sync ' --tarFile ./deploy.tar